name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PyPI project exists
        id: check-py
        run: |
          if [ -f "pyproject.toml" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-py.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        if: steps.check-py.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        if: steps.check-py.outputs.has_python == 'true'
        run: python -m build

      - name: Verify distribution archives
        if: steps.check-py.outputs.has_python == 'true'
        run: twine check dist/*

      - name: Publish to PyPI
        if: steps.check-py.outputs.has_python == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/*

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish NPM package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -f "package.json" ]; then
            echo "Publishing root package.json..."
            npm publish --access public
          elif [ -f "npm/package.json" ]; then
            echo "Publishing npm/package.json..."
            cd npm && npm publish --access public
          else
            echo "No package.json found. Skipping NPM publish."
          fi