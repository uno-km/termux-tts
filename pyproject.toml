[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-tts"
version = "1.4.2"
description = "On-device 4-Tier Text-to-Speech framework utilizing device resources (DSP Formant Vocoder, C++ Sherpa-ONNX Neural, Android Native & Expressive)"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AOSF / uno-km", email = "zhfldk014745@naver.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = [
    "tts",
    "text-to-speech",
    "vulkan",
    "vulkan-compute",
    "vits",
    "piper-tts",
    "sherpa-onnx",
    "sherpa-ncnn",
    "termux",
    "android",
    "on-device-ai",
    "speech-synthesis",
    "edge-ai",
    "formant-synthesis",
    "vocoder",
    "mobile-ai",
    "adreno",
    "mali-gpu",
    "dsp",
    "rosenberg-glottal",
    "biquad-filter",
    "expressive-speech",
    "voice-cloning",
    "audio-generation",
    "ncnn",
    "arm64",
    "snapdragon",
    "exynos",
    "real-time-factor",
    "low-latency",
    "zero-dependency",
    "voice-assistant",
    "headless-audio",
    "embedded-systems"
]
dependencies = [
    "numpy>=1.20.0",
    "ameva-component-sdk>=0.1.0,<2.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.15.0"]
neural = ["onnxruntime>=1.15.0"]
dev = ["pytest>=7.0", "paramiko>=3.0"]

[project.scripts]
termux-tts = "termux_tts.cli:main"

[project.entry-points."ameva.components"]
termux-tts = "termux_tts.adapter:create_adapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_tts*"]

